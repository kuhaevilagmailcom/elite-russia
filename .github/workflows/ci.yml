name: USERNAME CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.20.0'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run username:universe
      - run: npm run economy:sim -- 25000
