name: USERNAME CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20.20.0'

      - name: Install dependencies
        run: npm install

      - name: Emit generated lockfile
        run: |
          echo LOCK_BEGIN
          base64 -w0 package-lock.json
          echo
          echo LOCK_END

      - name: Run tests
        run: npm test
