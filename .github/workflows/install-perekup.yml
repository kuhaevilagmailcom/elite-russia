name: Install Perekup v5

on:
  push:
    branches: [main]
    paths: [perekup-v5-bootstrap.zip]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Replace legacy project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _runtime admin.py presentation.py config.json requirements.txt elite-russia elite-russia-public
          rm -rf public tests data
          unzip -q perekup-v5-bootstrap.zip -d /tmp/perekup
          cp -a /tmp/perekup/perekup-game-v5/. .
          mkdir -p public/assets/cars public/assets/icons
      - name: Download local car PNG assets
        shell: bash
        run: |
          set -euo pipefail
          base=https://raw.githubusercontent.com/tox1n71/streetrace-public/5a850bf690450d11aa80c2a40b87720354ab61b6/frontend/src/assets/cars
          curl -fL "$base/21093.png" -o public/assets/cars/lada-2109.png
          curl -fL "$base/21103.png" -o public/assets/cars/lada-2110.png
          curl -fL "$base/priora.png" -o public/assets/cars/lada-priora.png
          curl -fL "$base/logan.png" -o public/assets/cars/renault-logan.png
          curl -fL "$base/golf2.png" -o public/assets/cars/vw-golf.png
          curl -fL "$base/supra.png" -o public/assets/cars/toyota-supra.png
          curl -fL "$base/porshe.png" -o public/assets/cars/porsche-911.png
          curl -fL "$base/r8.png" -o public/assets/cars/audi-r8.png
          cbase=https://raw.githubusercontent.com/kacper-tokaj/cars-stack/b553ba17a1726f9a35f436bf455c42ac2eb5fbda/src/assets/cars
          curl -fL "$cbase/bmw.png" -o public/assets/cars/bmw.png
          curl -fL "$cbase/audi.png" -o public/assets/cars/audi.png
          curl -fL "$cbase/mercedes.png" -o public/assets/cars/mercedes.png
          curl -fL "$cbase/skoda.png" -o public/assets/cars/skoda.png
          curl -fL "https://raw.githubusercontent.com/Oussama-hamdi/DriveSync/2d6567205f904111c8b1f6a0fa314d38d62a8fa5/client/src/assets/images/toyotaCamry.png" -o public/assets/cars/toyota-camry.png
          curl -fL "https://raw.githubusercontent.com/katto-1204/RENTO-A-Car-Rental-System/dd4aa2fa25aa3446370615bbd14b91a5c033d3f1/assets/cars/nissan_gtr.png" -o public/assets/cars/nissan-gtr.png
      - name: Download Tabler UI icons
        shell: bash
        run: |
          set -euo pipefail
          ibase=https://raw.githubusercontent.com/tabler/tabler-icons/main/icons/outline
          for n in search car-garage gavel checklist apps chevron-left tools stethoscope cash trophy gift medal user book shield user-plus; do
            curl -fL "$ibase/$n.svg" -o "public/assets/icons/$n.svg"
          done
          curl -fL "$ibase/stack-2.svg" -o public/assets/icons/layers.svg
          curl -fL "$ibase/chart-bar.svg" -o public/assets/icons/chart.svg
      - name: Record third party sources
        shell: bash
        run: |
          cat > THIRD_PARTY.md <<'TXT'
          # Third-party assets
          - UI icons: Tabler Icons, MIT licensed: https://github.com/tabler/tabler-icons
          - Car PNG development assets are sourced from the public GitHub repositories listed in this file's commit history. Verify upstream asset licensing before a commercial release.
          TXT
      - name: Test
        run: npm test
      - name: Commit installed app
        shell: bash
        run: |
          set -euo pipefail
          rm -f perekup-v5-bootstrap.zip
          rm -f .github/workflows/install-perekup.yml
          git config user.name "Perekup Installer"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Build PEREKUP v5 Telegram Mini App"
          git push
