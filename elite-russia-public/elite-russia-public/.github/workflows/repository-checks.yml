name: Repository checks

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  basic-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for obvious secret files
        run: |
          test ! -f .env
          test ! -f secrets.json
          test ! -f config.json

      - name: Check markdown exists
        run: |
          test -f README.md
          test -f ROADMAP.md
          test -f CHANGELOG.md

      - name: Check UTF-8 BOM
        run: |
          if grep -rIl $'^ï»¿' . --exclude-dir=.git; then
            echo "UTF-8 BOM found"
            exit 1
          fi
