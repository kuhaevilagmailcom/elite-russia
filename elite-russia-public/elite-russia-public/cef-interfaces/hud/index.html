<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>ELITE RUSSIA HUD</title>
  <link rel="stylesheet" href="../shared/interface.css">
  <link rel="stylesheet" href="./hud.css">
</head>
<body>
  <aside class="hud">
    <div class="hud-logo">ELITE RUSSIA</div>
    <div class="hud-row"><span>Money</span><strong id="money">0 ₽</strong></div>
    <div class="hud-row"><span>Bank</span><strong id="bank">0 ₽</strong></div>
    <div class="hud-bars">
      <div><span>HP</span><progress id="hp" max="100" value="100"></progress></div>
      <div><span>ARM</span><progress id="armour" max="100" value="50"></progress></div>
      <div><span>Hunger</span><progress id="hunger" max="100" value="80"></progress></div>
    </div>
  </aside>

  <script src="../shared/elite-bridge.js"></script>
  <script src="./hud.js"></script>
</body>
</html>
