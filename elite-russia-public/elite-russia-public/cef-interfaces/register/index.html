<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>ELITE RUSSIA Register</title>
  <link rel="stylesheet" href="../shared/interface.css">
  <link rel="stylesheet" href="./register.css">
</head>
<body>
  <main class="register-page">
    <section class="er-panel">
      <h1 class="er-title">Регистрация</h1>
      <p class="er-subtitle">Создание нового игрового аккаунта</p>

      <label class="er-field">
        <span>Никнейм</span>
        <input id="nickname" class="er-input" autocomplete="username" value="Player_Name">
      </label>

      <label class="er-field">
        <span>Пароль</span>
        <input id="password" class="er-input" type="password" autocomplete="new-password">
      </label>

      <label class="er-field">
        <span>Пол персонажа</span>
        <select id="gender" class="er-input">
          <option value="male">Мужской</option>
          <option value="female">Женский</option>
        </select>
      </label>

      <button id="submit" class="er-button">Продолжить</button>
      <p id="message" class="er-note">После регистрации откроется выбор скина.</p>
    </section>
  </main>

  <script src="../shared/elite-bridge.js"></script>
  <script src="./register.js"></script>
</body>
</html>
